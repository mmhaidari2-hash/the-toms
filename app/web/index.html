<!DOCTYPE html>
<html lang="en-GB">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Learn British English by living with a British family.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https: blob:; worker-src 'self' blob:; child-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(self), camera=(), payment=(), usb=(), interest-cohort=()">
  <meta name="theme-color" content="#FBF7F0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="New Life UK">
  <link rel="apple-touch-icon" href="icons/nl3-180.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/nl3-180.png?v=3">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/nl3-167.png?v=3">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/nl3-152.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-nl3-32.png?v=3"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-nl3-16.png?v=3"/>
  <link rel="manifest" href="manifest.json?v=3">
  <title>New Life UK: British English for everyday life</title>
  <style>
    html,body{margin:0;height:100%;background:#140E0A;overscroll-behavior:none}
    /* Flutter renders inside the safe area; the notch / home-indicator strips stay painted dark. */
    #app{position:fixed;top:env(safe-area-inset-top);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);background:#FBF7F0}
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Georgia,serif;color:#1B2A4A;transition:opacity .4s}
    #splash img{width:88px;height:88px;border-radius:22px;box-shadow:0 10px 30px rgba(27,42,74,.25)}
    #splash .dot{width:6px;height:6px;border-radius:50%;background:#C8102E;animation:p 1s infinite alternate}
    @keyframes p{to{opacity:.2;transform:scale(.6)}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="splash" style="background:#FBF7F0"><img src="icons/nl3-192.png?v=3" alt="" style="border-radius:22%"><div style="font-size:22px">New Life UK</div><div class="dot"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function(){var s=document.getElementById('splash');s.style.opacity=0;setTimeout(function(){s.remove()},450);});
  </script>
  <script>
    // Offline: cache the app shell + assets (no network needed after first load).
    // ?reset (or #reset) wipes every service worker and cache, then reloads: the escape hatch for a stuck phone.
    if (/[?&#]reset\b/.test(location.href) && 'serviceWorker' in navigator) {
      Promise.all([navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); }),
        window.caches ? caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }) : null])
        .then(function(){ location.replace(location.pathname); });
    } else if ('serviceWorker' in navigator) window.addEventListener('load', function(){
      // Any leftover worker that isn't sw.js (e.g. an old flutter_service_worker.js) is removed.
      navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ var w = r.active || r.waiting || r.installing; if (w && !/\/sw\.js(\?|$)/.test(w.scriptURL)) r.unregister(); }); });
      navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(function(r){ r.update(); document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') r.update(); }); });
    });
    // A new deploy's worker takes over → reload once so the fresh app code runs (never stale JS).
    if ('serviceWorker' in navigator) { var hadController = !!navigator.serviceWorker.controller, reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function(){ if (hadController && !reloaded) { reloaded = true; location.reload(); } }); }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
